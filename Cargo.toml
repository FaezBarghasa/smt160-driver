[package]
name = "smt160-driver"
version = "0.1.0"
edition = "2024"
description = "A fixed-point, async-friendly driver for the SMT160 temperature sensor"

[dependencies]
fixed = { version = "1.27.0", features = ["az"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
fugit = "0.3.7"
critical-section = "1.1.2"
defmt = { version = "0.3", optional = true }

[dev-dependencies]
cortex-m-rtic = "1.1.4"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
stm32f1xx-hal = { version = "0.11.0", features = ["medium", "stm32f103"] }
defmt-rtt = "0.4.0"
panic-probe = { version = "0.3.1", features = ["print-defmt"] }

[features]
default = ["async", "defmt"]
async = []
defmt = ["dep:defmt"]
stm32f1 = []
esp32 = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true