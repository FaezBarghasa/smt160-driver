[package]
name = "smt160-driver"
version = "0.1.0"
edition = "2024"
description = "A fixed-point, async-friendly driver for the SMT160 temperature sensor"

[dependencies]
fixed = { version = "1.27", features = ["az", "defmt"] }
fixed-macro = "1.2"
az = "1.2"
bitflags = { version = "2.6", default-features = false }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
fugit = "0.3.7"
critical-section = "1.1.2"
defmt = { version = "0.3", optional = true }
usbd-serial = { version = "0.2.2", optional = true }
usb-device = { version = "0.3", optional = true }
stm32f1xx-hal = { version = "0.11.0", features = ["medium", "stm32f103"], optional = true }

[dev-dependencies]
rtic = { version = "2.1", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.1", features = ["cortex-m-systick"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
defmt-rtt = "0.4.0"
panic-probe = { version = "0.3.1", features = ["print-defmt"] }
panic-halt = "1.0.0"
nb = "1.1.0"
stm32-usbd = "0.8.0"

[features]
default = ["async", "defmt", "telemetry"]
async = []
defmt = ["dep:defmt"]
telemetry = ["dep:usbd-serial", "dep:usb-device"]
stm32f1 = ["dep:stm32f1xx-hal"]
esp32 = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true